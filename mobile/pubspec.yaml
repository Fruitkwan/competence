name: performance_hub
description: Performance Hub mobile app for Employees, Managers and HR.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State + navigation
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0

  # Backend
  supabase_flutter: ^2.5.6

  # Push (optional at runtime; can be omitted if not configured)
  firebase_core: ^3.3.0
  firebase_messaging: ^15.0.4
  flutter_local_notifications: ^17.2.2

  # Utilities
  flutter_dotenv: ^5.1.0
  intl: ^0.19.0
  file_picker: ^8.1.2
  url_launcher: ^6.3.0
  collection: ^1.18.0
  uuid: ^4.4.0

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - .env
